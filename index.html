<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>קפה ולב | Caffe & Heart — תפריט והזמנות</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2b1e16;
      --accent: #b07d52;
      --accent-hover: #96673f;
      --bg: #fbf8f5;
      --card-bg: #ffffff;
      --text: #2d2421;
      --text-muted: #736b66;
      --border: #ede6df;
      --badge: #2b1e16;
      --font-body: 'Assistant', sans-serif;
      --font-title: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 90px;
    }

    /* Навигация */
    header {
      position: sticky;
      top: 0;
      background: rgba(251, 248, 245, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--primary);
    }
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span {
      font-family: var(--font-title);
      font-style: italic;
      color: var(--accent);
      font-size: 1rem;
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.6rem 1.25rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .cart-btn:hover { background: var(--accent); }
    .cart-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      padding: 0.15rem 0.55rem;
      font-size: 0.8rem;
    }

    /* Главный баннер */
    .hero-banner {
      max-width: 1100px;
      margin: 1.5rem auto;
      padding: 0 1.25rem;
    }
    .hero-image-wrapper {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      height: 340px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(15,10,7,0.85) 20%, rgba(15,10,7,0.3) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem;
      color: #fff;
    }
    .hero-overlay h2 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    }
    .hero-overlay p {
      font-size: 1.1rem;
      max-width: 650px;
      margin-bottom: 1rem;
      color: #f1ede8;
    }
    .shop-meta {
      display: inline-flex;
      flex-wrap: wrap;
      gap: 1.25rem;
      font-size: 0.9rem;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 0.5rem 1.25rem;
      border-radius: 30px;
      width: fit-content;
    }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; }
    .meta-item span.status { color: #4ade80; font-weight: 700; }

    /* Фильтры категорий */
    .categories {
      max-width: 1100px;
      margin: 2rem auto 1.5rem;
      padding: 0 1.25rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 0.5rem 1.25rem;
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Сетка товаров */
    .menu-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }
    .card-img-wrapper {
      height: 180px;
      overflow: hidden;
      position: relative;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card:hover .card-img {
      transform: scale(1.05);
    }
    .card-content {
      padding: 1.25rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }
    .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .add-btn {
      background: var(--bg);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-family: var(--font-body);
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Модальное окно корзины */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .cart-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      width: 100%;
      max-width: 440px;
      background: #fff;
      z-index: 201;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }
    .drawer-overlay.open .cart-drawer { transform: translateX(0); }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    /* Форма оформления */
    .checkout-form {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .form-input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.95rem;
    }
    .order-type-switch {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .type-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    .type-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .submit-order {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      font-family: var(--font-body);
      cursor: pointer;
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .submit-order:hover { background: #1eb954; }

    /* Плавающая кнопка для мобильных */
    .floating-bar {
      display: none;
      position: fixed;
      bottom: 1rem;
      left: 1.25rem;
      right: 1.25rem;
      background: var(--primary);
      color: #fff;
      padding: 0.9rem 1.25rem;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 99;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .floating-bar { display: flex; }
      .hero-image-wrapper { height: 260px; }
      .hero-overlay h2 { font-size: 1.6rem; }
      .hero-overlay p { font-size: 0.95rem; }
    }
  </style>
</head>
