<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
    }
    .card {
      text-align: center;
      padding: 2.5rem;
      border: 1px solid #334155;
      border-radius: 16px;
      background: #1e293b;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 { margin-top: 0; color: #38bdf8; }
    p { color: #94a3b8; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Сайт запущен!</h1>
    <p>Репозиторий на GitHub подключен. Следующий шаг — публикация через Vercel.</p>
  </div>
</body>
</html>
