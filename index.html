<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">קפה ולב | Caffe & Heart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2b1e16;
      --accent: #b07d52;
      --accent-hover: #96673f;
      --bg: #fbf8f5;
      --card-bg: #ffffff;
      --text: #2d2421;
      --text-muted: #736b66;
      --border: #ede6df;
      --font-body: 'Assistant', 'Inter', system-ui, sans-serif;
      --font-title: 'Playfair Display', serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      background: rgba(251, 248, 245, 0.95);
      backdrop-filter: blur(10px);
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .nav-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--primary);
    }
    .logo h1 {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span {
      font-family: var(--font-title);
      font-style: italic;
      color: var(--accent);
      font-size: 1rem;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    /* Language Switcher */
    .lang-select {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.45rem 0.75rem;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      outline: none;
      transition: border-color 0.2s;
    }
    .lang-select:focus {
      border-color: var(--accent);
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 0.55rem 1.1rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
      transition: background 0.2s;
    }
    .cart-btn:hover { background: var(--accent); }
    .cart-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 50%;
      padding: 0.15rem 0.55rem;
      font-size: 0.8rem;
    }

    /* Hero */
    .hero {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.25rem;
      text-align: center;
    }
    .hero h2 {
      font-size: 2.3rem;
      color: var(--primary);
      margin-bottom: 0.75rem;
      font-weight: 800;
    }
    .hero p {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0 auto 1.5rem;
    }
    .shop-meta {
      display: inline-flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.75rem 1.5rem;
      border-radius: 30px;
      font-size: 0.9rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .meta-item { display: flex; align-items: center; gap: 0.4rem; color: var(--text); }
    .meta-item span.status { color: #16a34a; font-weight: 700; }

    /* Categories */
    .categories {
      max-width: 1100px;
      margin: 2rem auto 1.5rem;
      padding: 0 1.25rem;
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }
    .cat-pill {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 0.5rem 1.2rem;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-pill.active, .cat-pill:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Grid */
    .menu-grid {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1.25rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.75rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }
    .card-img-container {
      width: 100%;
      height: 190px;
      overflow: hidden;
      background: #f1ede8;
    }
    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s;
    }
    .card:hover .card-img { transform: scale(1.05); }
    .card-content {
      padding: 1.25rem;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.35rem;
    }
    .card-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }
    .price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--primary);
    }
    .add-btn {
      background: var(--bg);
      color: var(--primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .add-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    /* Cart Drawer */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: auto; }
    .cart-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 100%;
      max-width: 440px;
      background: #fff;
      z-index: 201;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      padding: 1.5rem;
    }
    
    /* RTL / LTR Drawer Placement */
    html[dir="rtl"] .cart-drawer {
      left: 0;
      transform: translateX(-100%);
    }
    html[dir="rtl"] .drawer-overlay.open .cart-drawer {
      transform: translateX(0);
    }
    html[dir="ltr"] .cart-drawer {
      right: 0;
      transform: translateX(100%);
    }
    html[dir="ltr"] .drawer-overlay.open .cart-drawer {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }
    .cart-items {
      flex-grow: 1;
      overflow-y: auto;
      margin: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg);
      padding: 0.75rem 1rem;
      border-radius: 10px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .qty-btn {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    /* Checkout Form */
    .checkout-form {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }
    .form-group { margin-bottom: 0.75rem; }
    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .form-input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
    }
    .order-type-switch {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .type-btn {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 8px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    .type-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .submit-order {
      width: 100%;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 0.9rem;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      margin-top: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .submit-order:hover { background: #1eb954; }

    /* Mobile Floating Bar */
    .floating-bar {
      display: none;
      position: fixed;
      bottom: 1rem;
      left: 1.25rem;
      right: 1.25rem;
      background: var(--primary);
      color: #fff;
      padding: 0.9rem 1.25rem;
      border-radius: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.25);
      z-index: 99;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .floating-bar { display: flex; }
      .hero h2 { font-size: 1.9rem; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <div class="nav-container">
      <a href="#" class="logo">
        <h1 id="brand-title">קפה ולב</h1>
        <span>Caffe & Heart</span>
      </a>
      
      <div class="nav-actions">
        <!-- Language Selector -->
        <select class="lang-select" id="lang-select" onchange="changeLanguage(this.value)">
          <option value="he">🇮🇱 עברית</option>
          <option value="en">🇬🇧 English</option>
          <option value="ru">🇷🇺 Русский</option>
          <option value="uk">🇺🇦 Українська</option>
        </select>

        <button class="cart-btn" onclick="toggleCart()">
          <span id="cart-title">סל הזמנות</span>
          <span class="cart-badge" id="cart-count">0</span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- Hero -->
    <section class="hero">
      <h2 id="hero-title">קפה משובח, מאפים טריים ואירוח מהלב</h2>
      <p id="hero-sub">קפה שכונתי אינטימי בראשון לציון. קפה מוקפד, כריכים ומאפים באפייה יומיומית.</p>
      <div class="shop-meta">
        <div class="meta-item" id="meta-address">📍 רחוב הורוביץ 36, ראשון לציון</div>
        <div class="meta-item" id="meta-hours">⏰ א'-ה' 08:00–19:00 | ו' 08:00–14:00</div>
        <div class="meta-item"><span class="status" id="meta-status">● פתוח להזמנות</span></div>
      </div>
    </section>

    <!-- Categories -->
    <div class="categories" id="cat-container"></div>

    <!-- Menu Grid -->
    <div class="menu-grid" id="menu-container"></div>
  </main>

  <!-- Mobile Floating Bar -->
  <div class="floating-bar" id="floating-cart" onclick="toggleCart()" style="display: none;">
    <div>
      <strong id="float-count">0</strong> | <span id="float-total">0 ₪</span>
    </div>
    <span id="float-action">לצפייה בהזמנה ←</span>
  </div>

  <!-- Cart Drawer -->
  <div class="drawer-overlay" id="cart-overlay" onclick="handleOverlayClick(event)">
    <div class="cart-drawer">
      <div class="drawer-header">
        <h3 id="drawer-title">ההזמנה שלך</h3>
        <button class="close-btn" onclick="toggleCart()">✕</button>
      </div>

      <div class="cart-items" id="cart-items-list"></div>

      <div class="checkout-form" id="checkout-block" style="display: none;">
        <div class="order-type-switch">
          <button type="button" class="type-btn active" id="btn-pickup" onclick="setOrderType('pickup')"></button>
          <button type="button" class="type-btn" id="btn-delivery" onclick="setOrderType('delivery')"></button>
        </div>

        <div class="form-group">
          <label id="lbl-name">שם מלא</label>
          <input type="text" class="form-input" id="cust-name" required>
        </div>

        <div class="form-group">
          <label id="lbl-phone">טלפון</label>
          <input type="tel" class="form-input" id="cust-phone" placeholder="050-0000000" required>
        </div>

        <div class="form-group" id="address-field" style="display: none;">
          <label id="lbl-address">כתובת למשלוח</label>
          <input type="text" class="form-input" id="cust-address">
        </div>

        <div class="form-group">
          <label id="lbl-notes">הערות להזמנה</label>
          <input type="text" class="form-input" id="cust-notes">
        </div>

        <div style="display: flex; justify-content: space-between; margin: 1rem 0; font-size: 1.2rem; font-weight: 800;">
          <span id="lbl-total">סה״כ לתשלום:</span>
          <span id="final-total">0 ₪</span>
        </div>

        <button class="submit-order" onclick="submitToWhatsApp()">
          <span id="btn-send-whatsapp">שליחת הזמנה ב-WhatsApp</span> 💬
        </button>
      </div>
    </div>
  </div>

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('site_lang', lang);
      document.getElementById('lang-select').value = lang;

      const t = i18n[lang];
      document.documentElement.lang = lang;
      document.documentElement.dir = t.dir;

      // Текстовые блоки
      document.getElementById('page-title').innerText = t.pageTitle;
      document.getElementById('brand-title').innerText = t.brand;
      document.getElementById('cart-title').innerText = t.cartBtn;
      document.getElementById('hero-title').innerText = t.heroTitle;
      document.getElementById('hero-sub').innerText = t.heroSub;
      document.getElementById('meta-address').innerText = t.address;
      document.getElementById('meta-hours').innerText = t.hours;
      document.getElementById('meta-status').innerText = t.status;
      document.getElementById('drawer-title').innerText = t.drawerTitle;
      document.getElementById('btn-pickup').innerText = t.pickup;
      document.getElementById('btn-delivery').innerText = t.delivery;
      document.getElementById('lbl-name').innerText = t.name;
      document.getElementById('cust-name').placeholder = t.namePlh;
      document.getElementById('lbl-phone').innerText = t.phone;
      document.getElementById('lbl-address').innerText = t.addressLbl;
      document.getElementById('cust-address').placeholder = t.addressPlh;
      document.getElementById('lbl-notes').innerText = t.notes;
      document.getElementById('cust-notes').placeholder = t.notesPlh;
      document.getElementById('lbl-total').innerText = t.total;
      document.getElementById('btn-send-whatsapp').innerText = t.sendWA;
      document.getElementById('float-action').innerText = t.viewOrder;

      renderCategories();
      renderMenu();
      updateCartUI();
    }

    function renderCategories() {
      const t = i18n[currentLang];
      const categories = [
        { key: 'all', label: t.all },
        { key: 'coffee', label: t.coffee },
        { key: 'bakery', label: t.bakery },
        { key: 'sandwiches', label: t.sandwiches }
      ];

      const catContainer = document.getElementById('cat-container');
      catContainer.innerHTML = categories.map(c => `
        <button class="cat-pill ${c.key === currentCategory ? 'active' : ''}" onclick="setCategory('${c.key}')">
          ${c.label}
        </button>
      `).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const t = i18n[currentLang];
      const container = document.getElementById('menu-container');
      const filtered = (currentCategory === 'all') 
        ? menuItems 
        : menuItems.filter(i => i.cat === currentCategory);

      container.innerHTML = filtered.map(item => `
        <div class="card">
          <div class="card-img-container">
            <img class="card-img" src="${item.image}" alt="${item.names[currentLang]}" loading="lazy">
          </div>
          <div class="card-content">
            <h3 class="card-title">${item.names[currentLang]}</h3>
            <p class="card-desc">${item.descs[currentLang]}</p>
            <div class="card-footer">
              <span class="price">${item.price} ₪</span>
              <button class="add-btn" onclick="addToCart(${item.id})">${t.addBtn}</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function changeQty(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
    }

    function updateCartUI() {
      const t = i18n[currentLang];
      const count = Object.values(cart).reduce((a, b) => a + b, 0);
      document.getElementById('cart-count').innerText = count;

      const floatingBar = document.getElementById('floating-cart');
      if (count > 0 && window.innerWidth <= 768) {
        floatingBar.style.display = 'flex';
      } else {
        floatingBar.style.display = 'none';
      }

      const list = document.getElementById('cart-items-list');
      const checkoutBlock = document.getElementById('checkout-block');

      if (count === 0) {
        list.innerHTML = `<p style="text-align: center; color: var(--text-muted); margin-top: 2rem;">${t.emptyCart}</p>`;
        checkoutBlock.style.display = 'none';
        return;
      }

      checkoutBlock.style.display = 'block';
      let total = 0;
      let html = '';

      for (let id in cart) {
        const item = menuItems.find(i => i.id == id);
        const itemTotal = item.price * cart[id];
        total += itemTotal;

        html += `
          <div class="cart-item">
            <div>
              <div style="font-weight: 700;">${item.names[currentLang]}</div>
              <div style="color: var(--text-muted); font-size: 0.85rem;">${item.price} ₪ × ${cart[id]} = ${itemTotal} ₪</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${id}, -1)">-</button>
              <span style="font-weight: 700;">${cart[id]}</span>
              <button class="qty-btn" onclick="changeQty(${id}, 1)">+</button>
            </div>
          </div>
        `;
      }

      list.innerHTML = html;
      document.getElementById('final-total').innerText = `${total} ₪`;
      document.getElementById('float-count').innerText = `${count} ${t.itemsWord}`;
      document.getElementById('float-total').innerText = `${total} ₪`;
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById('btn-pickup').classList.toggle('active', type === 'pickup');
      document.getElementById('btn-delivery').classList.toggle('active', type === 'delivery');
      document.getElementById('address-field').style.display = (type === 'delivery') ? 'block' : 'none';
    }

    function toggleCart() {
      document.getElementById('cart-overlay').classList.toggle('open');
    }

    function handleOverlayClick(e) {
      if (e.target.id === 'cart-overlay') toggleCart();
    }

    function submitToWhatsApp() {
      const t = i18n[currentLang];
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const address = document.getElementById('cust-address').value.trim();
      const notes = document.getElementById('cust-notes').value.trim();

      if (!name || !phone) {
        alert(t.alertContact);
        return;
      }
      if (orderType === 'delivery' && !address) {
        alert(t.alertAddress);
        return;
      }

      const orderTypeText = (orderType === 'pickup') ? t.pickup : t.delivery;

      let text = `${t.waHeader}\n`;
      text += `${t.waName} ${name}\n`;
      text += `${t.waPhone} ${phone}\n`;
      text += `${t.waType} ${orderTypeText}\n`;
      if (orderType === 'delivery') text += `${t.waAddress} ${address}\n`;
      if (notes) text += `${t.waNotes} ${notes}\n`;
      text += `\n${t.waDetails}\n`;

      let total = 0;
      for (let id in cart) {
        const item = menuItems.find(i => i.id == id);
        text += `• ${item.names[currentLang]} × ${cart[id]} (${item.price * cart[id]} ₪)\n`;
        total += item.price * cart[id];
      }
      text += `\n${t.waTotal} ${total} ₪`;

      // При необходимости укажите реальный номер WhatsApp (например, "972501234567")
      const phoneTo = "972500000000"; 
      const url = `https://wa.me/${phoneTo}?text=${encodeURIComponent(text)}`;
      window.open(url, '_blank');
    }

    // Инициализация при загрузке
    changeLanguage(currentLang);
